openapi: 3.1.0
info:
  title: MoonCraft Runtime Service API
  version: 3.0.0
  description: Runtime Protocol v3 HTTP API exposed by each project-scoped Runtime Service.
servers:
  - url: http://runtime-service
paths:
  /health:
    get:
      summary: Check Runtime Service readiness.
      responses:
        "200":
          description: Runtime Service is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/RuntimeError"
  /init:
    post:
      summary: Initialize a Runtime Service before business operations.
      description: >
        Idempotent for the same initialization data. The first call initializes
        the Runtime Service. Repeating the same request after initialization
        returns 200 OK with the same init response and must not mutate secrets,
        credentials, repository state, or workspace contents. Repeating
        initialization with different data, or while a run is active, returns
        409 Conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitRequest"
      responses:
        "200":
          description: Runtime Service initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"
        "400":
          $ref: "#/components/responses/RuntimeError"
        "409":
          $ref: "#/components/responses/RuntimeError"
        "500":
          $ref: "#/components/responses/RuntimeError"
        "503":
          $ref: "#/components/responses/RuntimeError"
  /exec:
    post:
      summary: Start or idempotently return an asynchronous Run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "202":
          description: Run accepted and running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "200":
          description: Existing idempotent Run returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/RuntimeError"
        "409":
          $ref: "#/components/responses/RuntimeError"
        "500":
          $ref: "#/components/responses/RuntimeError"
        "503":
          $ref: "#/components/responses/RuntimeError"
  /runs/{run_id}:
    get:
      summary: Read the authoritative Run status and message.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /runs/{run_id}/events:
    get:
      summary: Poll structured Run Events after a cursor.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          required: false
          description: Return events with id greater than this value.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Event page returned. An empty event list is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventsResponse"
        "404":
          $ref: "#/components/responses/RuntimeError"
        default:
          $ref: "#/components/responses/RuntimeError"
  /preview/:
    get:
      summary: Serve the current project preview root.
      responses:
        default:
          description: Generated-application preview response. MoonCraft proxies the response body and selected headers to the user's Preview Origin and does not interpret the HTTP status as Runtime health.
  /preview/start:
    post:
      summary: Start or verify the current project preview.
      responses:
        "200":
          description: Preview is ready for content proxying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewStartResponse"
        default:
          $ref: "#/components/responses/RuntimeError"
  /preview/{path}:
    get:
      summary: Serve a path below the current project preview subtree.
      parameters:
        - name: path
          in: path
          required: true
          description: Preview subtree path. MoonCraft proxies arbitrary subpaths under /preview/.
          schema:
            type: string
      responses:
        default:
          description: Generated-application preview response. MoonCraft proxies the response body and selected headers to the user's Preview Origin and does not interpret the HTTP status as Runtime health.
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    RuntimeError:
      description: Runtime error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeError"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/RuntimeServiceStatus"
        message:
          type: string
    RuntimeServiceStatus:
      type: string
      enum:
        - not_initialized
        - ready
        - running
    InitRequest:
      type: object
      additionalProperties: false
      required:
        - project
        - source_repository
        - source_credential
        - secrets
      properties:
        project:
          $ref: "#/components/schemas/ProjectRef"
        source_repository:
          $ref: "#/components/schemas/ProjectSourceRepository"
        source_credential:
          $ref: "#/components/schemas/ProjectSourceCredential"
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeSecret"
    InitResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - current_commit_sha
      properties:
        status:
          type: string
          enum:
            - ready
        current_commit_sha:
          type:
            - string
            - "null"
          description: Current checked-out source commit after initialization, or null for an empty repository.
        message:
          type: string
    ProjectRef:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
    ProjectSourceRepository:
      type: object
      additionalProperties: false
      required:
        - url
        - default_branch
        - current_commit_sha
      properties:
        url:
          type: string
          minLength: 1
        default_branch:
          type: string
          minLength: 1
        current_commit_sha:
          type:
            - string
            - "null"
          description: Last Ready Source Commit known to MoonCraft, or null before the first source-generating Run.
    ProjectSourceCredential:
      type: object
      additionalProperties: false
      required:
        - kind
        - username
        - password
      properties:
        kind:
          type: string
          enum:
            - git_https_token
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    RuntimeSecret:
      type: object
      additionalProperties: false
      required:
        - name
        - value
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
    ExecRequest:
      type: object
      additionalProperties: false
      required:
        - run_id
        - prompt
      properties:
        run_id:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
    Run:
      type: object
      additionalProperties: false
      required:
        - run_id
        - status
        - message
      properties:
        run_id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/RunStatus"
        message:
          type: string
        ready_commit_sha:
          type: string
          minLength: 1
          description: Final pushed Ready Source Commit. Required when status is succeeded.
      allOf:
        - if:
            properties:
              status:
                const: succeeded
          then:
            required:
              - ready_commit_sha
    RunStatus:
      type: string
      enum:
        - running
        - succeeded
        - failed
    RunEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - time
        - level
        - message
      properties:
        id:
          type: integer
          minimum: 1
        time:
          type: string
          description: Milliseconds since the Unix epoch, encoded as a decimal string.
        level:
          type: string
          enum:
            - info
            - warning
            - error
        message:
          type: string
    RunEventsResponse:
      type: object
      additionalProperties: false
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEvent"
    PreviewStartResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
        message:
          type: string
    RuntimeError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
