<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify Email - Mooncraft</title>
    <link rel="icon" href="/control-plane-assets/favicon.svg" />
    <link rel="stylesheet" href="/control-plane-assets/auth/account-action/style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Verify email</h1>
      <p>Mooncraft is checking your verification link.</p>
      <p id="status"></p>
      <a class="button" href="/">Back to app</a>
    </div>
    <script>
      async function errorMessage(response) {
        const text = await response.text();
        try {
          const payload = JSON.parse(text);
          return payload.error?.message || text || "Verification failed.";
        } catch (_) {
          return text || "Verification failed.";
        }
      }
      const token = new URLSearchParams(window.location.search).get("token");
      const status = document.getElementById("status");
      if (!token) {
        status.textContent = "This verification link is missing its token.";
      } else {
        fetch("/api/auth/email/verification/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ token })
        }).then(async (response) => {
          if (!response.ok) throw new Error(await errorMessage(response));
          const payload = await response.json();
          status.textContent = payload.message || "Email address verified.";
        }).catch((err) => {
          status.textContent = err.message || "Verification failed.";
        });
      }
    </script>
  </body>
</html>
