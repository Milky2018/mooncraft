<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoonCraft Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Sans", "Avenir Next", "Helvetica Neue", sans-serif;
        --font-title: 24px;
        --font-mid: 14px;
        --text-title: 700 var(--font-title) / 1.12 "IBM Plex Sans", "Avenir Next", "Helvetica Neue", sans-serif;
        --text-normal: 500 var(--font-mid) / 1.55 "IBM Plex Sans", "Avenir Next", "Helvetica Neue", sans-serif;
        --text-value: 600 var(--font-mid) / 1.45 "IBM Plex Sans", "Avenir Next", "Helvetica Neue", sans-serif;
        --color-title: #172033;
        --color-normal: #5e6a7d;
        --color-value: #172033;
        background: #f4f6f8;
        color: var(--color-normal);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font: var(--text-normal);
        color: var(--color-normal);
        background:
          radial-gradient(circle at top left, rgba(40, 124, 108, 0.14), transparent 34rem),
          linear-gradient(135deg, #f7f8fa, #edf2f7);
      }

      main {
        width: min(1220px, calc(100vw - 48px));
        margin: 0 auto;
        padding: 34px 0 56px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font: var(--text-title);
        color: var(--color-title);
      }

      h2,
      h3 {
        font: var(--text-title);
        color: var(--color-title);
      }

      button,
      input,
      select {
        font: inherit;
      }

      input,
      select {
        width: 100%;
        border: 1px solid rgba(23, 32, 51, 0.14);
        border-radius: 10px;
        background: #ffffff;
        color: var(--color-value);
        padding: 9px 11px;
        font: var(--text-value);
        outline: none;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 9px 11px;
        font: var(--text-value);
        cursor: pointer;
        background: #21665d;
        color: #ffffff;
      }

      button.secondary {
        background: #eef2f6;
        color: #243044;
      }

      button.danger {
        background: #fff1f0;
        color: #a3312b;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .hero,
      .card {
        border: 1px solid rgba(23, 32, 51, 0.1);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(23, 32, 51, 0.08);
      }

      .hero {
        padding: 22px;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: end;
      }

      .muted {
        font: var(--text-normal);
        color: var(--color-normal);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
        margin-top: 14px;
      }

      .card {
        padding: 18px;
      }

      .section-head,
      .hero-actions,
      .node-head,
      .node-actions,
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .section-head,
      .hero-actions,
      .node-head {
        justify-content: space-between;
      }

      .hero-actions,
      .node-actions {
        flex: 0 0 auto;
      }

      .icon-button {
        width: 48px;
        height: 48px;
        padding: 0;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .icon-button svg {
        width: 22px;
        height: 22px;
      }

      .icon-button.refresh {
        background: #e8f8f1;
        color: #17654f;
      }

      .icon-button.logout {
        background: #fff1f0;
        color: #a3312b;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .notice {
        border-radius: 12px;
        padding: 11px 12px;
        background: #ecfdf5;
        color: #17654f;
        font: var(--text-normal);
      }

      .notice.error {
        background: #fff1f0;
        color: #a3312b;
      }

      .notice[hidden],
      .node-children[hidden],
      .drawer[hidden],
      .key-edit[hidden] {
        display: none;
      }

      .tree {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .node {
        border: 1px solid rgba(23, 32, 51, 0.1);
        border-radius: 14px;
        background: #ffffff;
      }

      .node-head {
        padding: 12px;
      }

      .node-main {
        min-width: 0;
        display: grid;
        gap: 4px;
      }

      .node-main strong,
      .node-main code {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .node-children {
        margin: 0 12px 12px;
        padding-left: 16px;
        border-left: 2px solid rgba(33, 102, 93, 0.16);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .project-node {
        background: #f8fafc;
      }

      .run-node {
        background: #ffffff;
      }

      .node-actions button,
      .node-actions a {
        border-radius: 10px;
        padding: 8px 10px;
        font: var(--text-value);
        text-decoration: none;
      }

      .node-actions a {
        background: #eef2f6;
        color: #243044;
      }

      .disclosure {
        min-width: 40px;
      }

      .badge {
        display: inline-flex;
        width: fit-content;
        border-radius: 999px;
        padding: 4px 8px;
        background: #eef2f6;
        color: #49566b;
        font: var(--text-value);
      }

      .badge.running {
        background: #ecfdf5;
        color: #17654f;
      }

      .badge.failed {
        background: #fff1f0;
        color: #a3312b;
      }

      .empty-state {
        border: 1px dashed rgba(23, 32, 51, 0.18);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
        padding: 18px;
        font: var(--text-normal);
        color: var(--color-normal);
      }

      .drawer {
        border: 1px solid rgba(33, 102, 93, 0.18);
        border-radius: 14px;
        background: #f6fbf9;
        padding: 14px;
      }

      .row > * {
        flex: 1;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font: var(--text-normal);
        color: var(--color-normal);
        text-transform: none;
      }

      code {
        font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
        font: var(--text-value);
        color: var(--color-value);
      }

      strong {
        font: var(--text-value);
        color: var(--color-value);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="stack">
          <p class="muted">MoonCraft Admin</p>
          <h1>Operations Tree</h1>
        </div>
        <div class="hero-actions">
          <button class="icon-button refresh" id="refresh" aria-label="Refresh admin data" title="Refresh">
            <span class="sr-only">Refresh</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <path d="M20 5v5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M19 10a7 7 0 1 0 1.3 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <button class="icon-button logout" id="logout" aria-label="Log out" title="Log out">
            <span class="sr-only">Log Out</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <path d="M10 6H6.5A2.5 2.5 0 0 0 4 8.5v7A2.5 2.5 0 0 0 6.5 18H10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
              <path d="M14 8l4 4-4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M18 12H9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>
      </section>

      <section class="grid">
        <div id="notice" class="notice" hidden></div>
        <div class="card stack">
          <div class="section-head">
            <h2>Users -> Projects -> Runs</h2>
            <span id="tree-count" class="badge">0 users</span>
          </div>
          <div id="tree" class="tree"></div>
        </div>

        <div class="card stack">
          <div class="section-head">
            <h2>OpenRouter Keys</h2>
            <button id="open-key-drawer">Add Key</button>
          </div>
          <div id="key-drawer" class="drawer stack" hidden>
            <div class="section-head">
              <h3>Add OpenRouter Key</h3>
              <button class="secondary" id="cancel-create-key">Cancel</button>
            </div>
            <div class="row">
              <label>
                Label
                <input id="new-label" placeholder="Production key" />
              </label>
              <label>
                Priority
                <input id="new-priority" type="number" value="100" />
              </label>
            </div>
            <label>
              API key
              <input id="new-key" type="password" autocomplete="off" placeholder="sk-or-v1-..." />
            </label>
            <button id="create-key">Save Key</button>
          </div>
          <div id="keys" class="tree"></div>
        </div>
      </section>
    </main>

    <script>
      const notice = document.querySelector("#notice")
      const tree = document.querySelector("#tree")
      const keys = document.querySelector("#keys")
      const keyDrawer = document.querySelector("#key-drawer")
      const expandedUsers = new Set()
      const expandedProjects = new Set()
      let usersData = []
      let userProjects = new Map()
      let projectRuns = new Map()

      function showNotice(message, error = false) {
        notice.textContent = message
        notice.className = error ? "notice error" : "notice"
        notice.hidden = false
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        })
        if (response.status === 401) {
          window.location.assign("/admin/login")
          throw new Error("Admin login required.")
        }
        if (response.status === 204) return null
        const payload = await response.json().catch(() => ({}))
        if (!response.ok) {
          throw new Error(payload.error?.message || `HTTP ${response.status}`)
        }
        return payload
      }

      async function refresh() {
        try {
          const [userList, keyList] = await Promise.all([
            api("/api/admin/users/recent/100"),
            api("/api/admin/ai/keys"),
          ])
          usersData = userList.items || []
          document.querySelector("#tree-count").textContent = `${usersData.length} users`
          renderTree()
          renderKeys(keyList.items || [])
          showNotice("Admin data loaded.")
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function renderTree() {
        tree.replaceChildren(...(usersData.length === 0 ? [emptyState("No users found.")] : usersData.map(userNode)))
      }

      function userNode(item) {
        const user = item.user
        const open = expandedUsers.has(user.id)
        const node = document.createElement("div")
        node.className = "node"
        node.innerHTML = `
          <div class="node-head">
            <div class="node-main">
              <strong>${escapeHtml(user.display_name)}</strong>
              <code>${escapeHtml(user.email)}</code>
              <span class="muted">${Number(item.project_count || 0)} projects · ${Number(item.running_project_count || 0)} running</span>
            </div>
            <div class="node-actions">
              ${user.github_login ? `<span class="badge">${escapeHtml(user.github_login)}</span>` : ""}
              <button class="secondary disclosure" data-action="toggle">${open ? "Hide" : "Open"}</button>
            </div>
          </div>
          <div class="node-children" ${open ? "" : "hidden"}></div>
        `
        const children = node.querySelector(".node-children")
        if (open) {
          renderUserProjects(children, user.id)
        }
        node.querySelector('[data-action="toggle"]').addEventListener("click", () => toggleUser(user.id))
        return node
      }

      async function toggleUser(userId) {
        if (expandedUsers.has(userId)) {
          expandedUsers.delete(userId)
          renderTree()
          return
        }
        expandedUsers.add(userId)
        if (!userProjects.has(userId)) {
          userProjects.set(userId, null)
          renderTree()
          try {
            const detail = await api(`/api/admin/users/${encodeURIComponent(userId)}`)
            userProjects.set(userId, detail.projects || [])
          } catch (error) {
            userProjects.delete(userId)
            showNotice(error.message, true)
          }
        }
        renderTree()
      }

      function renderUserProjects(container, userId) {
        const items = userProjects.get(userId)
        if (items === null) {
          container.replaceChildren(emptyState("Loading projects..."))
        } else if (!items || items.length === 0) {
          container.replaceChildren(emptyState("This user has no projects."))
        } else {
          container.replaceChildren(...items.map(projectNode))
        }
      }

      function projectNode(item) {
        const project = item.project
        const owner = item.owner
        const open = expandedProjects.has(project.id)
        const preview = project.preview?.url
        const node = document.createElement("div")
        node.className = "node project-node"
        node.innerHTML = `
          <div class="node-head">
            <div class="node-main">
              <strong>${escapeHtml(project.display_name)}</strong>
              <code>${escapeHtml(project.id)}</code>
              <span class="muted">${escapeHtml(owner?.email || "owner missing")} · ${escapeHtml(project.agent_cli)} · ${escapeHtml(project.model || "default model")}</span>
            </div>
            <div class="node-actions">
              <span class="badge ${project.status === "Running" ? "running" : project.status === "Failed" ? "failed" : ""}">${escapeHtml(project.status)}</span>
              ${preview ? `<a href="${escapeAttr(preview)}" target="_blank" rel="noreferrer">Preview</a>` : ""}
              <button class="secondary" data-action="toggle">${open ? "Hide Runs" : "Runs"}</button>
              <button class="secondary" data-action="diagnostics">Diagnostics</button>
              <button class="danger" data-action="delete">Delete</button>
            </div>
          </div>
          <div class="node-children" ${open ? "" : "hidden"}></div>
        `
        const children = node.querySelector(".node-children")
        if (open) {
          renderProjectRuns(children, project.id)
        }
        node.querySelector('[data-action="toggle"]').addEventListener("click", () => toggleProject(project.id))
        node.querySelector('[data-action="diagnostics"]').addEventListener("click", () => {
          window.open(`/api/admin/projects/${encodeURIComponent(project.id)}`, "_blank", "noopener")
        })
        node.querySelector('[data-action="delete"]').addEventListener("click", () => deleteProject(project))
        return node
      }

      async function toggleProject(projectId) {
        if (expandedProjects.has(projectId)) {
          expandedProjects.delete(projectId)
          renderTree()
          return
        }
        expandedProjects.add(projectId)
        if (!projectRuns.has(projectId)) {
          projectRuns.set(projectId, null)
          renderTree()
          try {
            const diagnostics = await api(`/api/admin/projects/${encodeURIComponent(projectId)}`)
            projectRuns.set(projectId, diagnostics.runs || [])
          } catch (error) {
            projectRuns.delete(projectId)
            showNotice(error.message, true)
          }
        }
        renderTree()
      }

      function renderProjectRuns(container, projectId) {
        const items = projectRuns.get(projectId)
        if (items === null) {
          container.replaceChildren(emptyState("Loading runs..."))
        } else if (!items || items.length === 0) {
          container.replaceChildren(emptyState("This project has no runs."))
        } else {
          container.replaceChildren(...items.map(runNode))
        }
      }

      function runNode(run) {
        const node = document.createElement("div")
        node.className = "node run-node"
        node.innerHTML = `
          <div class="node-head">
            <div class="node-main">
              <strong>${escapeHtml(run.state)}</strong>
              <code>${escapeHtml(run.run_id)}</code>
              <span class="muted">${escapeHtml(run.phase || "NoPhase")} · started ${escapeHtml(run.started_at)}</span>
            </div>
            <div class="node-actions">
              <button class="secondary" data-action="events">Events</button>
              <button class="secondary" data-action="logs">Logs</button>
            </div>
          </div>
        `
        node.querySelector('[data-action="events"]').addEventListener("click", () => {
          window.open(`/api/admin/runs/${encodeURIComponent(run.run_id)}/events/0`, "_blank", "noopener")
        })
        node.querySelector('[data-action="logs"]').addEventListener("click", () => {
          window.open(`/api/admin/runs/${encodeURIComponent(run.run_id)}/logs`, "_blank", "noopener")
        })
        return node
      }

      async function deleteProject(project) {
        if (!confirm(`Delete project "${project.display_name}"?`)) return
        try {
          await api(`/api/admin/projects/${encodeURIComponent(project.id)}`, { method: "DELETE" })
          showNotice("Project deleted.")
          for (const [userId, projects] of userProjects.entries()) {
            if (Array.isArray(projects)) {
              userProjects.set(userId, projects.filter((item) => item.project.id !== project.id))
            }
          }
          projectRuns.delete(project.id)
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function renderKeys(items) {
        keys.replaceChildren(...(items.length === 0 ? [emptyState("No keys yet.")] : items.map(keyNode)))
      }

      function keyNode(key) {
        const node = document.createElement("div")
        node.className = "node"
        const toggleStatus = key.status === "active" ? "disabled" : "active"
        const toggleLabel = key.status === "active" ? "Disable" : "Enable"
        node.innerHTML = `
          <div class="node-head">
            <div class="node-main">
              <strong>${escapeHtml(key.label)}</strong>
              <code>${escapeHtml(key.key_hint || "saved key")}</code>
              ${key.last_error ? `<span class="notice error">${escapeHtml(key.last_error)}</span>` : ""}
              <div class="key-edit stack" hidden>
                <div class="row">
                  <label>
                    Label
                    <input data-field="label" value="${escapeAttr(key.label)}" />
                  </label>
                  <label>
                    Priority
                    <input data-field="priority" type="number" value="${key.priority}" />
                  </label>
                </div>
                <div class="row">
                  <label>
                    New API key
                    <input data-field="api_key" type="password" placeholder="Leave blank to keep current key" />
                  </label>
                  <label>
                    Status
                    <select data-field="status">
                      ${["active", "disabled", "exhausted", "error"].map((status) => `
                        <option value="${status}" ${status === key.status ? "selected" : ""}>${status}</option>
                      `).join("")}
                    </select>
                  </label>
                </div>
                <div class="row">
                  <button data-action="save">Save Changes</button>
                  <button data-action="cancel" class="secondary">Cancel</button>
                </div>
              </div>
            </div>
            <div class="node-actions">
              <span class="badge">${escapeHtml(key.status)}</span>
              <span class="badge">${Number(key.priority || 0)}</span>
              <button data-action="edit" class="secondary">Edit</button>
              <button data-action="toggle" class="secondary">${toggleLabel}</button>
              <button data-action="delete" class="danger">Delete</button>
            </div>
          </div>
        `
        const editPanel = node.querySelector(".key-edit")
        node.querySelector('[data-action="edit"]').addEventListener("click", () => {
          editPanel.hidden = false
        })
        node.querySelector('[data-action="cancel"]').addEventListener("click", () => {
          editPanel.hidden = true
        })
        node.querySelector('[data-action="save"]').addEventListener("click", async () => {
          await updateKey(key.id, {
            label: node.querySelector('[data-field="label"]').value,
            api_key: node.querySelector('[data-field="api_key"]').value,
            status: node.querySelector('[data-field="status"]').value,
            priority: Number(node.querySelector('[data-field="priority"]').value || "0"),
          })
        })
        node.querySelector('[data-action="toggle"]').addEventListener("click", async () => {
          await updateKey(key.id, {
            label: key.label,
            api_key: "",
            status: toggleStatus,
            priority: key.priority,
          })
        })
        node.querySelector('[data-action="delete"]').addEventListener("click", async () => {
          if (confirm(`Delete ${key.label}?`)) await deleteKey(key.id)
        })
        return node
      }

      async function createKey() {
        try {
          await api("/api/admin/ai/keys", {
            method: "POST",
            body: JSON.stringify({
              label: document.querySelector("#new-label").value,
              api_key: document.querySelector("#new-key").value,
              priority: Number(document.querySelector("#new-priority").value || "0"),
            }),
          })
          document.querySelector("#new-key").value = ""
          document.querySelector("#new-label").value = ""
          document.querySelector("#new-priority").value = "100"
          keyDrawer.hidden = true
          showNotice("Key added.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      async function updateKey(id, payload) {
        try {
          await api(`/api/admin/ai/keys/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: JSON.stringify(payload),
          })
          showNotice("Key updated.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      async function deleteKey(id) {
        try {
          await api(`/api/admin/ai/keys/${encodeURIComponent(id)}`, { method: "DELETE" })
          showNotice("Key deleted.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]))
      }

      function escapeAttr(value) {
        return escapeHtml(value)
      }

      function emptyState(message) {
        const node = document.createElement("div")
        node.className = "empty-state"
        node.textContent = message
        return node
      }

      document.querySelector("#refresh").addEventListener("click", refresh)
      document.querySelector("#logout").addEventListener("click", async () => {
        await fetch("/api/admin/logout", { method: "POST" })
        window.location.assign("/admin/login")
      })
      document.querySelector("#open-key-drawer").addEventListener("click", () => {
        keyDrawer.hidden = false
        document.querySelector("#new-label").focus()
      })
      document.querySelector("#cancel-create-key").addEventListener("click", () => {
        keyDrawer.hidden = true
      })
      document.querySelector("#create-key").addEventListener("click", createKey)
      refresh()
    </script>
  </body>
</html>
