<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoonCraft Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --background: oklch(0.98 0.003 265);
        --foreground: oklch(0.185 0.01 270);
        --foreground-rgb: 38, 36, 42;
        --accent: oklch(0.62 0.13 293);
        --success: oklch(0.55 0.17 145);
        --destructive: oklch(0.58 0.24 28);
        --foreground-3: color-mix(in oklch, var(--foreground) 3%, var(--background));
        --foreground-5: color-mix(in oklch, var(--foreground) 5%, var(--background));
        --foreground-10: color-mix(in oklch, var(--foreground) 10%, var(--background));
        --foreground-50: color-mix(in oklch, var(--foreground) 50%, var(--background));
        --foreground-70: color-mix(in oklch, var(--foreground) 70%, var(--background));
        --font-title: 14px;
        --font-mid: 13px;
        --text-title: 600 var(--font-title) / 1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --text-normal: 400 var(--font-mid) / 1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --text-value: 500 var(--font-mid) / 1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --color-title: var(--foreground);
        --color-normal: var(--foreground-70);
        --color-value: var(--foreground);
        --border: oklch(from var(--foreground) l c h / 0.06);
        --shadow: rgba(var(--foreground-rgb), 0.06) 0px 0px 0px 1px, rgba(0, 0, 0, 0.06) 0px 1px 1px -0.5px, rgba(0, 0, 0, 0.06) 0px 3px 3px -1.5px;
        background: var(--background);
        color: var(--color-normal);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font: var(--text-normal);
        color: var(--color-normal);
        background: var(--background);
      }

      main {
        width: min(1220px, calc(100vw - 24px));
        margin: 0 auto;
        padding: 12px 0 32px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font: var(--text-title);
        color: var(--color-title);
      }

      h2,
      h3 {
        font: var(--text-title);
        color: var(--color-title);
      }

      button,
      input,
      select {
        font: inherit;
      }

      input,
      select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--background);
        color: var(--color-value);
        padding: 9px 11px;
        font: var(--text-value);
        outline: none;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 7px 10px;
        font: var(--text-value);
        cursor: pointer;
        background: var(--foreground);
        color: var(--background);
      }

      button.secondary {
        background: var(--foreground-5);
        color: var(--foreground);
      }

      button.danger {
        background: oklch(from var(--destructive) l c h / 0.10);
        color: var(--destructive);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .hero,
      .card {
        border: 0;
        border-radius: 10px;
        background: var(--background);
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 12px;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: end;
      }

      .muted {
        font: var(--text-normal);
        color: var(--color-normal);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        margin-top: 6px;
      }

      .card {
        padding: 12px;
      }

      .section-head,
      .hero-actions,
      .node-head,
      .node-actions,
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .section-head,
      .hero-actions,
      .node-head {
        justify-content: space-between;
      }

      .hero-actions,
      .node-actions {
        flex: 0 0 auto;
      }

      .icon-button {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .icon-button svg {
        width: 16px;
        height: 16px;
      }

      .icon-button.refresh {
        background: oklch(from var(--success) l c h / 0.12);
        color: var(--success);
      }

      .icon-button.logout {
        background: oklch(from var(--destructive) l c h / 0.10);
        color: var(--destructive);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .notice {
        border-radius: 6px;
        padding: 8px 10px;
        background: oklch(from var(--success) l c h / 0.12);
        color: var(--success);
        font: var(--text-normal);
      }

      .notice.error {
        background: oklch(from var(--destructive) l c h / 0.10);
        color: var(--destructive);
      }

      .notice[hidden],
      .node-children[hidden],
      .key-edit-row[hidden],
      .action-menu[hidden] {
        display: none;
      }

      .tree {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .node {
        border: 0;
        border-radius: 8px;
        background: var(--foreground-3);
      }

      .node-head {
        padding: 8px;
      }

      .node-main {
        min-width: 0;
        display: grid;
        gap: 4px;
      }

      .node-main strong,
      .node-main code {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .node-children {
        margin: 0 8px 8px;
        padding-left: 12px;
        border-left: 1px solid var(--foreground-10);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .project-node {
        background: var(--background);
      }

      .run-node {
        background: var(--background);
      }

      .node-actions button,
      .node-actions a {
        border-radius: 6px;
        padding: 7px 9px;
        font: var(--text-value);
        text-decoration: none;
      }

      .node-actions a {
        background: var(--foreground-5);
        color: var(--foreground);
      }

      .disclosure {
        min-width: 32px;
      }

      .badge {
        display: inline-flex;
        width: fit-content;
        border-radius: 6px;
        padding: 2px 6px;
        background: var(--foreground-5);
        color: var(--foreground-50);
        font: var(--text-value);
      }

      .badge.running {
        background: oklch(from var(--success) l c h / 0.12);
        color: var(--success);
      }

      .badge.failed {
        background: oklch(from var(--destructive) l c h / 0.10);
        color: var(--destructive);
      }

      .empty-state {
        border: 1px dashed var(--foreground-10);
        border-radius: 8px;
        background: var(--foreground-3);
        padding: 12px;
        font: var(--text-normal);
        color: var(--color-normal);
      }

      .row > * {
        flex: 1;
      }

      .table-wrap {
        width: 100%;
        overflow: visible;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--background);
      }

      .key-table {
        width: 100%;
        border-collapse: collapse;
      }

      .key-table th,
      .key-table td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
      }

      .key-table th {
        color: var(--color-normal);
        font: var(--text-normal);
        background: var(--foreground-3);
      }

      .key-table td {
        color: var(--color-value);
        font: var(--text-value);
      }

      .key-table tr:last-child td {
        border-bottom: 0;
      }

      .key-table .muted {
        color: var(--color-normal);
      }

      .key-table .error-text {
        color: var(--destructive);
      }

      .key-table .actions-cell {
        position: relative;
        width: 44px;
        text-align: right;
      }

      .key-table .create-actions {
        width: 148px;
        white-space: nowrap;
      }

      .key-table .create-actions button {
        margin-left: 4px;
      }

      .key-table input,
      .key-table select {
        padding: 7px 8px;
      }

      .key-create-row td {
        background: var(--foreground-3);
      }

      .table-empty {
        padding: 18px;
        color: var(--color-normal);
        font: var(--text-normal);
        text-align: center;
      }

      .dots-button {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 6px;
        background: var(--foreground-5);
        color: var(--foreground);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .dots-button svg {
        width: 16px;
        height: 16px;
      }

      .action-menu {
        position: absolute;
        top: 32px;
        right: 0;
        z-index: 10;
        min-width: 124px;
        padding: 4px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--background);
        box-shadow: var(--shadow);
      }

      .menu-item {
        width: 100%;
        padding: 7px 8px;
        border-radius: 6px;
        background: transparent;
        color: var(--foreground);
        text-align: left;
      }

      .menu-item:hover {
        background: var(--foreground-5);
      }

      .menu-item.danger {
        background: transparent;
        color: var(--destructive);
      }

      .menu-item.danger:hover {
        background: oklch(from var(--destructive) l c h / 0.10);
      }

      .key-edit-panel {
        padding: 10px;
        border-radius: 8px;
        background: var(--foreground-3);
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font: var(--text-normal);
        color: var(--color-normal);
        text-transform: none;
      }

      code {
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font: var(--text-value);
        color: var(--color-value);
      }

      strong {
        font: var(--text-value);
        color: var(--color-value);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="stack">
          <h1>Admin</h1>
        </div>
        <div class="hero-actions">
          <button class="icon-button refresh" id="refresh" aria-label="Refresh admin data" title="Refresh">
            <span class="sr-only">Refresh</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <path d="M20 5v5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M19 10a7 7 0 1 0 1.3 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <button class="icon-button logout" id="logout" aria-label="Log out" title="Log out">
            <span class="sr-only">Log Out</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <path d="M10 6H6.5A2.5 2.5 0 0 0 4 8.5v7A2.5 2.5 0 0 0 6.5 18H10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
              <path d="M14 8l4 4-4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M18 12H9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>
      </section>

      <section class="grid">
        <div id="notice" class="notice" hidden></div>
        <div class="card stack">
          <div class="section-head">
            <h2>Users</h2>
            <span id="tree-count" class="badge">0 users</span>
          </div>
          <div id="tree" class="tree"></div>
        </div>

        <div class="card stack">
          <div class="section-head">
            <h2>Keys</h2>
            <button id="add-key-row">Add Key</button>
          </div>
          <div id="keys"></div>
        </div>
      </section>
    </main>

    <script>
      const notice = document.querySelector("#notice")
      const tree = document.querySelector("#tree")
      const keys = document.querySelector("#keys")
      const expandedUsers = new Set()
      const expandedProjects = new Set()
      let usersData = []
      let userProjects = new Map()
      let projectRuns = new Map()
      let keyData = new Map()
      let keyItems = []
      let creatingKey = false

      function showNotice(message, error = false) {
        notice.textContent = message
        notice.className = error ? "notice error" : "notice"
        notice.hidden = false
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        })
        if (response.status === 401) {
          window.location.assign("/admin/login")
          throw new Error("Admin login required.")
        }
        if (response.status === 204) return null
        const payload = await response.json().catch(() => ({}))
        if (!response.ok) {
          throw new Error(payload.error?.message || `HTTP ${response.status}`)
        }
        return payload
      }

      async function refresh() {
        try {
          const [userList, keyList] = await Promise.all([
            api("/api/admin/users/recent/100"),
            api("/api/admin/ai/keys"),
          ])
          usersData = userList.items || []
          document.querySelector("#tree-count").textContent = `${usersData.length} users`
          renderTree()
          renderKeys(keyList.items || [])
          showNotice("Loaded.")
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function renderTree() {
        tree.replaceChildren(...(usersData.length === 0 ? [emptyState("No users.")] : usersData.map(userNode)))
      }

      function userNode(item) {
        const user = item.user
        const open = expandedUsers.has(user.id)
        const node = document.createElement("div")
        node.className = "node"
        node.innerHTML = `
          <div class="node-head">
            <div class="node-main">
              <strong>${escapeHtml(user.display_name)}</strong>
              <code>${escapeHtml(user.email)}</code>
              <span class="muted">${Number(item.project_count || 0)} projects · ${Number(item.running_project_count || 0)} running</span>
            </div>
            <div class="node-actions">
              ${user.github_login ? `<span class="badge">${escapeHtml(user.github_login)}</span>` : ""}
              <button class="secondary disclosure" data-action="toggle">${open ? "Hide" : "Open"}</button>
            </div>
          </div>
          <div class="node-children" ${open ? "" : "hidden"}></div>
        `
        const children = node.querySelector(".node-children")
        if (open) {
          renderUserProjects(children, user.id)
        }
        node.querySelector('[data-action="toggle"]').addEventListener("click", () => toggleUser(user.id))
        return node
      }

      async function toggleUser(userId) {
        if (expandedUsers.has(userId)) {
          expandedUsers.delete(userId)
          renderTree()
          return
        }
        expandedUsers.add(userId)
        if (!userProjects.has(userId)) {
          userProjects.set(userId, null)
          renderTree()
          try {
            const detail = await api(`/api/admin/users/${encodeURIComponent(userId)}`)
            userProjects.set(userId, detail.projects || [])
          } catch (error) {
            userProjects.delete(userId)
            showNotice(error.message, true)
          }
        }
        renderTree()
      }

      function renderUserProjects(container, userId) {
        const items = userProjects.get(userId)
        if (items === null) {
          container.replaceChildren(emptyState("Loading..."))
        } else if (!items || items.length === 0) {
          container.replaceChildren(emptyState("No projects."))
        } else {
          container.replaceChildren(...items.map(projectNode))
        }
      }

      function projectNode(item) {
        const project = item.project
        const owner = item.owner
        const open = expandedProjects.has(project.id)
        const preview = project.preview?.url
        const node = document.createElement("div")
        node.className = "node project-node"
        node.innerHTML = `
          <div class="node-head">
            <div class="node-main">
              <strong>${escapeHtml(project.display_name)}</strong>
              <code>${escapeHtml(project.id)}</code>
              <span class="muted">${escapeHtml(owner?.email || "No owner")} · ${escapeHtml(project.agent_cli)} · ${escapeHtml(project.model || "default")}</span>
            </div>
            <div class="node-actions">
              <span class="badge ${project.status === "Running" ? "running" : project.status === "Failed" ? "failed" : ""}">${escapeHtml(project.status)}</span>
              ${preview ? `<a href="${escapeAttr(preview)}" target="_blank" rel="noreferrer">Preview</a>` : ""}
              <button class="secondary" data-action="toggle">${open ? "Hide" : "Runs"}</button>
              <button class="secondary" data-action="diagnostics">Details</button>
              <button class="danger" data-action="delete">Delete</button>
            </div>
          </div>
          <div class="node-children" ${open ? "" : "hidden"}></div>
        `
        const children = node.querySelector(".node-children")
        if (open) {
          renderProjectRuns(children, project.id)
        }
        node.querySelector('[data-action="toggle"]').addEventListener("click", () => toggleProject(project.id))
        node.querySelector('[data-action="diagnostics"]').addEventListener("click", () => {
          window.open(`/api/admin/projects/${encodeURIComponent(project.id)}`, "_blank", "noopener")
        })
        node.querySelector('[data-action="delete"]').addEventListener("click", () => deleteProject(project))
        return node
      }

      async function toggleProject(projectId) {
        if (expandedProjects.has(projectId)) {
          expandedProjects.delete(projectId)
          renderTree()
          return
        }
        expandedProjects.add(projectId)
        if (!projectRuns.has(projectId)) {
          projectRuns.set(projectId, null)
          renderTree()
          try {
            const diagnostics = await api(`/api/admin/projects/${encodeURIComponent(projectId)}`)
            projectRuns.set(projectId, diagnostics.runs || [])
          } catch (error) {
            projectRuns.delete(projectId)
            showNotice(error.message, true)
          }
        }
        renderTree()
      }

      function renderProjectRuns(container, projectId) {
        const items = projectRuns.get(projectId)
        if (items === null) {
          container.replaceChildren(emptyState("Loading..."))
        } else if (!items || items.length === 0) {
          container.replaceChildren(emptyState("No runs."))
        } else {
          container.replaceChildren(...items.map(runNode))
        }
      }

      function runNode(run) {
        const node = document.createElement("div")
        node.className = "node run-node"
        node.innerHTML = `
          <div class="node-head">
            <div class="node-main">
              <strong>${escapeHtml(run.state)}</strong>
              <code>${escapeHtml(run.run_id)}</code>
              <span class="muted">${escapeHtml(run.phase || "NoPhase")} · started ${escapeHtml(run.started_at)}</span>
            </div>
            <div class="node-actions">
              <button class="secondary" data-action="events">Events</button>
              <button class="secondary" data-action="logs">Logs</button>
            </div>
          </div>
        `
        node.querySelector('[data-action="events"]').addEventListener("click", () => {
          window.open(`/api/admin/runs/${encodeURIComponent(run.run_id)}/events/0`, "_blank", "noopener")
        })
        node.querySelector('[data-action="logs"]').addEventListener("click", () => {
          window.open(`/api/admin/runs/${encodeURIComponent(run.run_id)}/logs`, "_blank", "noopener")
        })
        return node
      }

      async function deleteProject(project) {
        if (!confirm(`Delete project "${project.display_name}"?`)) return
        try {
          await api(`/api/admin/projects/${encodeURIComponent(project.id)}`, { method: "DELETE" })
          showNotice("Project deleted.")
          for (const [userId, projects] of userProjects.entries()) {
            if (Array.isArray(projects)) {
              userProjects.set(userId, projects.filter((item) => item.project.id !== project.id))
            }
          }
          projectRuns.delete(project.id)
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function renderKeys(items) {
        keyItems = items
        keyData = new Map(items.map((key) => [key.id, key]))
        keys.innerHTML = `
          <div class="table-wrap">
            <table class="key-table">
              <thead>
                <tr>
                  <th>Label</th>
                  <th>Key hint</th>
                  <th>Status</th>
                  <th>Priority</th>
                  <th>Last used</th>
                  <th>Last error</th>
                  <th>Updated</th>
                  <th aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody>
                ${creatingKey ? createKeyRow() : ""}
                ${items.map(keyRows).join("")}
                ${items.length === 0 && !creatingKey ? `<tr><td colspan="8"><div class="table-empty">No keys.</div></td></tr>` : ""}
              </tbody>
            </table>
          </div>
        `
      }

      function createKeyRow() {
        return `
          <tr class="key-create-row">
            <td><input data-create-field="label" placeholder="Label" /></td>
            <td><input data-create-field="api_key" type="password" autocomplete="off" placeholder="OpenRouter API key" /></td>
            <td><span class="badge running">active</span></td>
            <td><input data-create-field="priority" type="number" value="100" /></td>
            <td class="muted">-</td>
            <td class="muted">-</td>
            <td class="muted">-</td>
            <td class="actions-cell create-actions">
              <button data-action="save-create-key">Save</button>
              <button data-action="cancel-create-key" class="secondary">Cancel</button>
            </td>
          </tr>
        `
      }

      function keyRows(key) {
        const escapedId = escapeAttr(key.id)
        const nextStatus = key.status === "active" ? "disabled" : "active"
        const toggleLabel = key.status === "active" ? "Disable" : "Enable"
        return `
          <tr class="key-row" data-key-id="${escapedId}">
            <td><strong>${escapeHtml(key.label)}</strong></td>
            <td><code>${escapeHtml(key.key_hint || "saved key")}</code></td>
            <td><span class="badge ${key.status === "active" ? "running" : key.status === "error" ? "failed" : ""}">${escapeHtml(key.status)}</span></td>
            <td>${Number(key.priority || 0)}</td>
            <td class="muted">${emptyCell(key.last_used_at)}</td>
            <td>${key.last_error ? `<span class="error-text">${escapeHtml(key.last_error)}</span>` : `<span class="muted">-</span>`}</td>
            <td class="muted">${emptyCell(key.updated_at)}</td>
            <td class="actions-cell">
              <button class="dots-button" data-action="key-menu" aria-label="Open key actions" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <circle cx="5" cy="12" r="1.8" fill="currentColor"></circle>
                  <circle cx="12" cy="12" r="1.8" fill="currentColor"></circle>
                  <circle cx="19" cy="12" r="1.8" fill="currentColor"></circle>
                </svg>
              </button>
              <div class="action-menu" hidden>
                <button class="menu-item" data-action="edit-key">Edit</button>
                <button class="menu-item" data-action="toggle-key" data-next-status="${nextStatus}">${toggleLabel}</button>
                <button class="menu-item danger" data-action="delete-key">Delete</button>
              </div>
            </td>
          </tr>
          <tr class="key-edit-row" data-key-edit-id="${escapedId}" hidden>
            <td colspan="8">
              <div class="key-edit-panel stack">
                <div class="row">
                  <label>
                    Label
                    <input data-field="label" value="${escapeAttr(key.label)}" />
                  </label>
                  <label>
                    Priority
                    <input data-field="priority" type="number" value="${Number(key.priority || 0)}" />
                  </label>
                </div>
                <div class="row">
                  <label>
                    New API key
                    <input data-field="api_key" type="password" placeholder="Keep current key" />
                  </label>
                  <label>
                    Status
                    <select data-field="status">
                      ${["active", "disabled", "exhausted", "error"].map((status) => `
                        <option value="${status}" ${status === key.status ? "selected" : ""}>${status}</option>
                      `).join("")}
                    </select>
                  </label>
                </div>
                <div class="row">
                  <button data-action="save-key">Save</button>
                  <button data-action="cancel-key" class="secondary">Cancel</button>
                </div>
              </div>
            </td>
          </tr>
        `
      }

      function closeActionMenus(exceptMenu = null) {
        keys.querySelectorAll(".action-menu").forEach((menu) => {
          if (menu !== exceptMenu) {
            menu.hidden = true
            const button = menu.parentElement?.querySelector('[data-action="key-menu"]')
            if (button) button.setAttribute("aria-expanded", "false")
          }
        })
      }

      function keyEditRow(id) {
        return Array.from(keys.querySelectorAll(".key-edit-row")).find((row) => row.dataset.keyEditId === id)
      }

      function handleKeyAction(event) {
        const button = event.target.closest("[data-action]")
        if (!button || !keys.contains(button)) return
        const action = button.dataset.action
        if (action === "key-menu") {
          event.stopPropagation()
          const menu = button.parentElement.querySelector(".action-menu")
          const nextHidden = !menu.hidden
          closeActionMenus(menu)
          menu.hidden = nextHidden
          button.setAttribute("aria-expanded", String(!menu.hidden))
          return
        }
        if (action === "cancel-create-key") {
          creatingKey = false
          renderKeys(keyItems)
          return
        }
        if (action === "save-create-key") {
          createKeyFromRow(button.closest(".key-create-row"))
          return
        }
        const row = button.closest("[data-key-id], .key-edit-row")
        const id = row?.dataset.keyId || row?.dataset.keyEditId
        if (!id) return
        const key = keyData.get(id)
        if (action === "edit-key") {
          closeActionMenus()
          const editRow = keyEditRow(id)
          if (editRow) editRow.hidden = false
          return
        }
        if (action === "cancel-key") {
          row.hidden = true
          return
        }
        if (action === "save-key") {
          updateKey(id, {
            label: row.querySelector('[data-field="label"]').value,
            api_key: row.querySelector('[data-field="api_key"]').value,
            status: row.querySelector('[data-field="status"]').value,
            priority: Number(row.querySelector('[data-field="priority"]').value || "0"),
          })
          return
        }
        if (action === "toggle-key" && key) {
          closeActionMenus()
          updateKey(id, {
            label: key.label,
            api_key: "",
            status: button.dataset.nextStatus,
            priority: key.priority,
          })
          return
        }
        if (action === "delete-key" && key) {
          closeActionMenus()
          if (confirm(`Delete ${key.label}?`)) deleteKey(id)
        }
      }

      function emptyCell(value) {
        return value ? escapeHtml(value) : "-"
      }

      async function createKeyFromRow(row) {
        try {
          await api("/api/admin/ai/keys", {
            method: "POST",
            body: JSON.stringify({
              label: row.querySelector('[data-create-field="label"]').value,
              api_key: row.querySelector('[data-create-field="api_key"]').value,
              priority: Number(row.querySelector('[data-create-field="priority"]').value || "0"),
            }),
          })
          creatingKey = false
          showNotice("Key added.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      async function updateKey(id, payload) {
        try {
          await api(`/api/admin/ai/keys/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: JSON.stringify(payload),
          })
          showNotice("Key updated.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      async function deleteKey(id) {
        try {
          await api(`/api/admin/ai/keys/${encodeURIComponent(id)}`, { method: "DELETE" })
          showNotice("Key deleted.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]))
      }

      function escapeAttr(value) {
        return escapeHtml(value)
      }

      function emptyState(message) {
        const node = document.createElement("div")
        node.className = "empty-state"
        node.textContent = message
        return node
      }

      document.querySelector("#refresh").addEventListener("click", refresh)
      document.querySelector("#logout").addEventListener("click", async () => {
        await fetch("/api/admin/logout", { method: "POST" })
        window.location.assign("/admin/login")
      })
      document.querySelector("#add-key-row").addEventListener("click", () => {
        creatingKey = true
        renderKeys(keyItems)
        keys.querySelector('[data-create-field="label"]')?.focus()
      })
      keys.addEventListener("click", handleKeyAction)
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".actions-cell")) closeActionMenus()
      })
      refresh()
    </script>
  </body>
</html>
