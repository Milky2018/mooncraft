<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoonCraft Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --background: oklch(0.98 0.003 265);
        --foreground: oklch(0.185 0.01 270);
        --foreground-rgb: 38, 36, 42;
        --accent: oklch(0.62 0.13 293);
        --success: oklch(0.55 0.17 145);
        --destructive: oklch(0.58 0.24 28);
        --foreground-3: color-mix(in oklch, var(--foreground) 3%, var(--background));
        --foreground-5: color-mix(in oklch, var(--foreground) 5%, var(--background));
        --foreground-10: color-mix(in oklch, var(--foreground) 10%, var(--background));
        --foreground-50: color-mix(in oklch, var(--foreground) 50%, var(--background));
        --foreground-70: color-mix(in oklch, var(--foreground) 70%, var(--background));
        --font-title: 14px;
        --font-mid: 13px;
        --text-title: 600 var(--font-title) / 1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --text-normal: 400 var(--font-mid) / 1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --text-value: 500 var(--font-mid) / 1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --color-title: var(--foreground);
        --color-normal: var(--foreground-70);
        --color-value: var(--foreground);
        --border: oklch(from var(--foreground) l c h / 0.06);
        --shadow: rgba(var(--foreground-rgb), 0.06) 0px 0px 0px 1px, rgba(0, 0, 0, 0.06) 0px 1px 1px -0.5px, rgba(0, 0, 0, 0.06) 0px 3px 3px -1.5px;
        background: var(--background);
        color: var(--color-normal);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font: var(--text-normal);
        color: var(--color-normal);
        background: var(--foreground-3);
      }

      main {
        min-height: 100vh;
        width: 100%;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font: var(--text-title);
        color: var(--color-title);
      }

      h2,
      h3 {
        font: var(--text-title);
        color: var(--color-title);
      }

      button,
      input,
      select {
        font: inherit;
      }

      input,
      select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--background);
        color: var(--color-value);
        padding: 9px 11px;
        font: var(--text-value);
        outline: none;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 7px 10px;
        font: var(--text-value);
        cursor: pointer;
        background: var(--foreground);
        color: var(--background);
      }

      button.secondary {
        background: var(--foreground-5);
        color: var(--foreground);
      }

      button.danger {
        background: oklch(from var(--destructive) l c h / 0.10);
        color: var(--destructive);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .card {
        border: 0;
        border-radius: 10px;
        background: var(--background);
        box-shadow: var(--shadow);
      }

      .muted {
        font: var(--text-normal);
        color: var(--color-normal);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card {
        padding: 12px;
      }

      .section-head,
      .sidebar-actions,
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .section-head,
      .sidebar-actions {
        justify-content: space-between;
      }

      .admin-layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        min-height: 100vh;
      }

      .admin-sidebar {
        min-height: 100vh;
        padding: 12px;
        position: sticky;
        top: 0;
        align-self: start;
        background: var(--foreground-3);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sidebar-brand {
        padding: 2px 4px 10px;
      }

      .sidebar-actions {
        margin-top: auto;
        padding: 10px 0 0;
        border-top: 1px solid var(--border);
      }

      .admin-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .nav-button {
        width: 100%;
        min-height: 34px;
        padding: 0 8px;
        border-radius: 4px;
        background: transparent;
        color: var(--color-normal);
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
      }

      .nav-button::before {
        content: "";
        width: 2px;
        height: 18px;
        border-radius: 2px;
        background: transparent;
        margin-right: 7px;
        flex: 0 0 auto;
      }

      .nav-button span {
        flex: 1;
      }

      .nav-button:hover,
      .nav-button.active {
        background: var(--foreground-10);
        color: var(--color-value);
      }

      .nav-button.active::before {
        background: var(--accent);
      }

      .admin-content {
        min-width: 0;
        padding: 12px;
        background: var(--background);
      }

      .admin-view[hidden] {
        display: none;
      }

      .icon-button {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .icon-button svg {
        width: 16px;
        height: 16px;
      }

      .icon-button.refresh {
        background: oklch(from var(--success) l c h / 0.12);
        color: var(--success);
      }

      .icon-button.logout {
        background: oklch(from var(--destructive) l c h / 0.10);
        color: var(--destructive);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .notice {
        border-radius: 6px;
        padding: 8px 10px;
        background: oklch(from var(--success) l c h / 0.12);
        color: var(--success);
        font: var(--text-normal);
      }

      .notice.error {
        background: oklch(from var(--destructive) l c h / 0.10);
        color: var(--destructive);
      }

      .notice[hidden],
      .key-edit-row[hidden],
      .action-menu[hidden] {
        display: none;
      }

      .tree {
        width: 100%;
      }

      .disclosure {
        min-width: 32px;
      }

      .badge {
        display: inline-flex;
        width: fit-content;
        border-radius: 6px;
        padding: 2px 6px;
        background: var(--foreground-5);
        color: var(--foreground-50);
        font: var(--text-value);
      }

      .badge.running {
        background: oklch(from var(--success) l c h / 0.12);
        color: var(--success);
      }

      .badge.failed {
        background: oklch(from var(--destructive) l c h / 0.10);
        color: var(--destructive);
      }

      .empty-state {
        border: 1px dashed var(--foreground-10);
        border-radius: 8px;
        background: var(--foreground-3);
        padding: 12px;
        font: var(--text-normal);
        color: var(--color-normal);
      }

      .row > * {
        flex: 1;
      }

      .table-wrap {
        width: 100%;
        overflow: visible;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--background);
      }

      .key-table {
        width: 100%;
        border-collapse: collapse;
      }

      .key-table th,
      .key-table td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
      }

      .key-table th {
        color: var(--color-normal);
        font: var(--text-normal);
        background: var(--foreground-3);
      }

      .key-table td {
        color: var(--color-value);
        font: var(--text-value);
      }

      .key-table tr:last-child td {
        border-bottom: 0;
      }

      .key-table .muted {
        color: var(--color-normal);
      }

      .key-table .error-text {
        color: var(--destructive);
      }

      .key-table .numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .key-table .actions-cell {
        position: relative;
        width: 44px;
        text-align: right;
      }

      .key-table .nested-cell {
        padding: 0;
        background: var(--foreground-3);
      }

      .nested-wrap {
        padding: 8px;
      }

      .nested-wrap .table-wrap {
        border-color: var(--foreground-10);
      }

      .nested-wrap .key-table th {
        background: var(--foreground-5);
      }

      .nested-wrap .nested-wrap {
        padding: 6px;
      }

      .key-table .create-actions {
        width: 76px;
        white-space: nowrap;
      }

      .key-table .create-actions button {
        margin-left: 4px;
      }

      .key-table input,
      .key-table select {
        padding: 7px 8px;
      }

      .key-create-row td {
        background: var(--foreground-3);
      }

      .table-empty {
        padding: 18px;
        color: var(--color-normal);
        font: var(--text-normal);
        text-align: center;
      }

      .dots-button {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 6px;
        background: var(--foreground-5);
        color: var(--foreground);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .dots-button svg {
        width: 16px;
        height: 16px;
      }

      .action-menu {
        position: absolute;
        top: 32px;
        right: 0;
        z-index: 10;
        min-width: 132px;
        padding: 4px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--background);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .menu-item {
        width: 100%;
        height: 30px;
        padding: 0 8px;
        border-radius: 6px;
        border: 0;
        background: transparent;
        color: var(--foreground);
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        font: var(--text-value);
        text-decoration: none;
        text-align: left;
        white-space: nowrap;
      }

      .menu-item:hover {
        background: var(--foreground-5);
      }

      .menu-item.danger {
        background: transparent;
        color: var(--destructive);
      }

      .menu-item.danger:hover {
        background: oklch(from var(--destructive) l c h / 0.10);
      }

      .menu-item.confirming,
      .menu-item.danger.confirming {
        background: var(--destructive);
        color: var(--background);
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font: var(--text-normal);
        color: var(--color-normal);
        text-transform: none;
      }

      code {
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font: var(--text-value);
        color: var(--color-value);
      }

      strong {
        font: var(--text-value);
        color: var(--color-value);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="notice" class="notice" hidden></div>
      <section class="admin-layout">
        <aside class="admin-sidebar">
          <div class="sidebar-brand">
            <h1>Admin</h1>
          </div>
          <nav class="admin-nav" aria-label="Admin sections">
            <button class="nav-button active" type="button" data-view-target="users">
              <span>Users</span>
              <strong id="nav-users-count">0</strong>
            </button>
            <button class="nav-button" type="button" data-view-target="keys">
              <span>OpenRouter Keys</span>
              <strong id="nav-keys-count">0</strong>
            </button>
            <button class="nav-button" type="button" data-view-target="models">
              <span>Models</span>
              <strong id="nav-models-count">0</strong>
            </button>
          </nav>
          <div class="sidebar-actions">
            <button class="icon-button refresh" id="refresh" aria-label="Refresh admin data" title="Refresh">
              <span class="sr-only">Refresh</span>
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                <path d="M20 5v5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M19 10a7 7 0 1 0 1.3 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
              </svg>
            </button>
            <button class="icon-button logout" id="logout" aria-label="Log out" title="Log out">
              <span class="sr-only">Log Out</span>
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                <path d="M10 6H6.5A2.5 2.5 0 0 0 4 8.5v7A2.5 2.5 0 0 0 6.5 18H10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
                <path d="M14 8l4 4-4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M18 12H9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
              </svg>
            </button>
          </div>
        </aside>
        <div class="admin-content">
          <section class="admin-view card stack" id="view-users" data-view="users">
            <div class="section-head">
              <h2>Users</h2>
              <span id="tree-count" class="badge">0 users</span>
            </div>
            <div id="tree" class="tree"></div>
          </section>

          <section class="admin-view card stack" id="view-keys" data-view="keys" hidden>
            <div class="section-head">
              <h2>OpenRouter Keys</h2>
              <button class="icon-button" id="add-key-row" aria-label="Add key" title="Add key">
                <span class="sr-only">Add key</span>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
                </svg>
              </button>
            </div>
            <span id="key-count" class="badge">0 keys</span>
            <div id="keys"></div>
          </section>

          <section class="admin-view card stack" id="view-models" data-view="models" hidden>
            <div class="section-head">
              <h2>Models</h2>
              <button class="icon-button" id="add-model-row" aria-label="Add model" title="Add model">
                <span class="sr-only">Add model</span>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
                </svg>
              </button>
            </div>
            <span id="model-count" class="badge">0 models</span>
            <div id="models"></div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const notice = document.querySelector("#notice")
      const tree = document.querySelector("#tree")
      const keys = document.querySelector("#keys")
      const models = document.querySelector("#models")
      const navButtons = Array.from(document.querySelectorAll("[data-view-target]"))
      const adminViews = Array.from(document.querySelectorAll("[data-view]"))
      const treeCount = document.querySelector("#tree-count")
      const keyCount = document.querySelector("#key-count")
      const modelCount = document.querySelector("#model-count")
      const navUsersCount = document.querySelector("#nav-users-count")
      const navKeysCount = document.querySelector("#nav-keys-count")
      const navModelsCount = document.querySelector("#nav-models-count")
      const expandedUsers = new Set()
      const expandedProjects = new Set()
      let usersData = []
      let userProjects = new Map()
      let projectRuns = new Map()
      let keyData = new Map()
      let keyItems = []
      let aiConfig = { default_model: "", allowed_models: [], updated_at: "" }
      let adminModelItems = []
      let adminModelsError = ""
      let creatingKey = false
      let creatingModel = false
      let confirmingProjectDeleteId = ""
      let confirmingKeyDeleteId = ""
      let confirmingModelRemoveId = ""
      let activeMenuKey = ""
      let activeView = "users"

      function icon(name) {
        const paths = {
          more: `<circle cx="5" cy="12" r="1.8" fill="currentColor"></circle><circle cx="12" cy="12" r="1.8" fill="currentColor"></circle><circle cx="19" cy="12" r="1.8" fill="currentColor"></circle>`,
          plus: `<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>`,
          check: `<path d="M5 12.5l4 4L19 6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>`,
          x: `<path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>`,
          edit: `<path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path><path d="M13.5 8.5l2 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>`,
          trash: `<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>`,
          eye: `<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path><path d="M12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z" stroke="currentColor" stroke-width="2.2"></path>`,
          list: `<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>`,
          file: `<path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path><path d="M14 3v5h5" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path>`,
          activity: `<path d="M4 12h4l2-6 4 12 2-6h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>`,
        }
        return `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none">${paths[name] || paths.more}</svg>`
      }

      function iconButton(action, title, iconName, className = "secondary", attrs = "") {
        return `<button class="icon-button ${className}" data-action="${action}" aria-label="${escapeAttr(title)}" title="${escapeAttr(title)}" ${attrs}>${icon(iconName)}</button>`
      }

      function menuButton(action, title, label, className = "menu-item", attrs = "") {
        return `<button class="${className}" data-action="${action}" aria-label="${escapeAttr(title)}" title="${escapeAttr(title)}" ${attrs}>${escapeHtml(label)}</button>`
      }

      function menuLink(href, title, label) {
        return `<a class="menu-item" href="${escapeAttr(href)}" target="_blank" rel="noreferrer" aria-label="${escapeAttr(title)}" title="${escapeAttr(title)}">${escapeHtml(label)}</a>`
      }

      function menuStateAttrs(menuKey) {
        return activeMenuKey === menuKey ? `aria-expanded="true"` : `aria-expanded="false"`
      }

      function menuHiddenAttr(menuKey) {
        return activeMenuKey === menuKey ? "" : "hidden"
      }

      function showNotice(message, error = false) {
        notice.textContent = message
        notice.className = error ? "notice error" : "notice"
        notice.hidden = false
      }

      function setActiveView(view, updateHash = true) {
        activeView = view === "keys" || view === "models" ? view : "users"
        adminViews.forEach((node) => {
          node.hidden = node.dataset.view !== activeView
        })
        navButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.viewTarget === activeView)
        })
        if (updateHash && window.location.hash !== `#${activeView}`) {
          history.replaceState(null, "", `#${activeView}`)
        }
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        })
        if (response.status === 401) {
          window.location.assign("/admin/login")
          throw new Error("Admin login required.")
        }
        if (response.status === 204) return null
        const payload = await response.json().catch(() => ({}))
        if (!response.ok) {
          throw new Error(payload.error?.message || `HTTP ${response.status}`)
        }
        return payload
      }

      async function refresh() {
        try {
          confirmingProjectDeleteId = ""
          confirmingKeyDeleteId = ""
          confirmingModelRemoveId = ""
          activeMenuKey = ""
          const [userList, keyList, configResult, modelResult] = await Promise.all([
            api("/api/admin/users/recent/100"),
            api("/api/admin/ai/keys"),
            api("/api/admin/ai/config"),
            api("/api/admin/ai/models").catch((error) => ({ error: error.message })),
          ])
          usersData = userList.items || []
          keyItems = keyList.items || []
          aiConfig = configResult
          if (modelResult.error) {
            adminModelItems = []
            adminModelsError = modelResult.error
          } else {
            adminModelItems = modelResult.items || []
            adminModelsError = ""
          }
          treeCount.textContent = `${usersData.length} users`
          keyCount.textContent = `${keyItems.length} keys`
          modelCount.textContent = `${aiConfig.allowed_models.length} models`
          navUsersCount.textContent = String(usersData.length)
          navKeysCount.textContent = String(keyItems.length)
          navModelsCount.textContent = String(aiConfig.allowed_models.length)
          renderTree()
          renderKeys(keyItems)
          renderModels()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function renderTree() {
        tree.innerHTML = `
          <div class="table-wrap">
            <table class="key-table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Email</th>
                  <th>Projects</th>
                  <th>Running</th>
                  <th>GitHub</th>
                  <th aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody>
                ${usersData.length === 0 ? `<tr><td colspan="6"><div class="table-empty">No users.</div></td></tr>` : usersData.map(userRows).join("")}
              </tbody>
            </table>
          </div>
        `
        wireAdminTreeActions()
      }

      function userRows(item) {
        const user = item.user
        const open = expandedUsers.has(user.id)
        const menuKey = `user:${user.id}`
        return `
          <tr data-user-id="${escapeAttr(user.id)}">
            <td><strong>${escapeHtml(user.display_name)}</strong></td>
            <td><code>${escapeHtml(user.email)}</code></td>
            <td>${Number(item.project_count || 0)}</td>
            <td>${Number(item.running_project_count || 0)}</td>

      function renderProjectRuns(projectId) {

        return `
          <div class="nested-wrap">

                    <th>Run</th>
                    <th>Phase</th>

      function runRows(run) {

      function wireAdminTreeActions() {

        tree.querySelectorAll('[data-action="diagnostics"]').forEach((button) => {
          button.addEventListener("click", () => {
            closeActionMenus()

            const projectId = button.closest("[data-project-id]")?.dataset.projectId

      async function deleteProject(projectId) {
        if (confirmingProjectDeleteId !== projectId) {
          confirmingProjectDeleteId = projectId
          activeMenuKey = `project:${projectId}`
          renderTree()
          return
        }
        try {
          await api(`/api/admin/projects/${encodeURIComponent(projectId)}`, { method: "DELETE" })
          confirmingProjectDeleteId = ""
          activeMenuKey = ""
          showNotice("Project deleted.")
          for (const [userId, projects] of userProjects.entries()) {
            if (Array.isArray(projects)) {
              userProjects.set(userId, projects.filter((item) => item.project.id !== projectId))
            }
          }
          projectRuns.delete(projectId)
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function renderKeys(items) {
        keyItems = items
        keyData = new Map(items.map((key) => [key.id, key]))
        keys.innerHTML = `
          <div class="table-wrap">
            <table class="key-table">
              <thead>
                <tr>
                  <th>Label</th>
                  <th>Key hint</th>
                  <th>Status</th>
                  <th>Priority</th>
                  <th>Last used</th>
                  <th>Last error</th>
                  <th>Updated</th>
                  <th aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody>
                ${creatingKey ? createKeyRow() : ""}
                ${items.map(keyRows).join("")}
                ${items.length === 0 && !creatingKey ? `<tr><td colspan="8"><div class="table-empty">No keys.</div></td></tr>` : ""}
              </tbody>
            </table>
          </div>
        `
      }

      function modelById(id) {
        return adminModelItems.find((item) => item.id === id)
      }

      function modelLabel(id) {
        const item = modelById(id)
        if (!item) return id
        return item.name && item.name !== item.id ? `${item.name} - ${item.id}` : item.id
      }

      function formatContextLength(value) {
        const number = Number(value || 0)
        if (!Number.isFinite(number) || number <= 0) return "-"
        if (number >= 1000000) return `${formatCompactNumber(number / 1000000)}M`
        if (number >= 1000) return `${formatCompactNumber(number / 1000)}K`
        return String(number)
      }

      function formatCompactNumber(value) {
        if (Number.isInteger(value)) return String(value)
        return value.toFixed(1).replace(/\\.0$/, "")
      }

      function formatTokenPrice(value) {
        const number = Number(value || 0)
        if (!Number.isFinite(number) || number <= 0) return "-"
        const perMillion = number * 1000000
        const amount = perMillion >= 1 ? perMillion.toFixed(2) : perMillion.toFixed(4)
        return `$${amount.replace(/\\.00$/, "")} / 1M`
      }

      function allowedModelRows() {
        return aiConfig.allowed_models.map((id) => {
          const item = modelById(id)
          const menuKey = `model:${id}`
          const isDefault = id === aiConfig.default_model
          const confirming = confirmingModelRemoveId === id
          return `
            <tr data-model-id="${escapeAttr(id)}">
              <td><strong>${escapeHtml(modelLabel(id))}</strong></td>
              <td><code>${escapeHtml(id)}</code></td>
              <td>${isDefault ? `<span class="badge running">default</span>` : `<span class="muted">-</span>`}</td>
              <td class="numeric">${item ? escapeHtml(formatContextLength(item.context_length)) : "-"}</td>
              <td class="numeric muted">${item ? escapeHtml(formatTokenPrice(item.prompt_price)) : "-"}</td>
              <td class="numeric muted">${item ? escapeHtml(formatTokenPrice(item.completion_price)) : "-"}</td>
              <td class="actions-cell">
                ${iconButton("model-menu", "Model actions", "more", "dots-button", menuStateAttrs(menuKey))}
                <div class="action-menu" ${menuHiddenAttr(menuKey)}>
                  ${isDefault ? "" : menuButton("set-default-model", "Set default model", "Set default")}
                  ${menuButton("remove-model", confirming ? "Confirm remove model" : "Remove model", confirming ? "Confirm remove" : "Remove", `menu-item danger ${confirming ? "confirming" : ""}`)}
                </div>
              </td>
            </tr>
          `
        }).join("")
      }

      function modelCreateRow() {
        const available = adminModelItems.filter((item) => !aiConfig.allowed_models.includes(item.id))
        return `
          <tr class="key-create-row">
            <td colspan="2">
              <select data-create-model="id" aria-label="Model">
                ${available.length === 0 ? `<option value="">No available models</option>` : available.map((item) => `
                  <option value="${escapeAttr(item.id)}">${escapeHtml(modelLabel(item.id))}</option>
                `).join("")}
              </select>
            </td>
            <td class="muted">-</td>
            <td class="numeric muted">-</td>
            <td class="numeric muted">-</td>
            <td class="numeric muted">-</td>
            <td class="actions-cell create-actions">
              ${iconButton("save-create-model", "Save model", "check", "secondary", available.length === 0 ? "disabled" : "")}
              ${iconButton("cancel-create-model", "Cancel", "x", "secondary")}
            </td>
          </tr>
        `
      }

      function renderModels() {
        modelCount.textContent = `${aiConfig.allowed_models.length} models`
        navModelsCount.textContent = String(aiConfig.allowed_models.length)
        models.innerHTML = `
          ${adminModelsError ? `<div class="notice error">${escapeHtml(adminModelsError)}</div>` : ""}
          <div class="table-wrap">
            <table class="key-table">
              <thead>
                <tr>
                  <th>Model</th>
                  <th>ID</th>
                  <th>Default</th>
                  <th class="numeric">Context</th>
                  <th class="numeric">Input</th>
                  <th class="numeric">Output</th>
                  <th aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody>
                ${creatingModel ? modelCreateRow() : ""}
                ${allowedModelRows()}
                ${aiConfig.allowed_models.length === 0 && !creatingModel ? `<tr><td colspan="7"><div class="table-empty">No models.</div></td></tr>` : ""}
              </tbody>
            </table>
          </div>
        `
      }

      function createKeyRow() {
        return `
          <tr class="key-create-row">
            <td><input data-create-field="label" placeholder="Label" /></td>
            <td><input data-create-field="api_key" type="password" autocomplete="off" placeholder="OpenRouter API key" /></td>
            <td><span class="badge running">active</span></td>
            <td><input data-create-field="priority" type="number" value="100" /></td>
            <td class="muted">-</td>
            <td class="muted">-</td>
            <td class="muted">-</td>
            <td class="actions-cell create-actions">
              ${iconButton("save-create-key", "Save key", "check")}
              ${iconButton("cancel-create-key", "Cancel", "x", "secondary")}
            </td>
          </tr>
        `
      }

      function keyRows(key) {
        const escapedId = escapeAttr(key.id)
        const nextStatus = key.status === "active" ? "disabled" : "active"
        const toggleLabel = key.status === "active" ? "Disable" : "Enable"
        const confirming = confirmingKeyDeleteId === key.id
        return `
          <tr class="key-row" data-key-id="${escapedId}">
            <td><strong>${escapeHtml(key.label)}</strong></td>
            <td><code>${escapeHtml(key.key_hint || "saved key")}</code></td>
            <td><span class="badge ${key.status === "active" ? "running" : key.status === "error" ? "failed" : ""}">${escapeHtml(key.status)}</span></td>
            <td>${Number(key.priority || 0)}</td>
            <td class="muted">${emptyCell(key.last_used_at)}</td>
            <td>${key.last_error ? `<span class="error-text">${escapeHtml(key.last_error)}</span>` : `<span class="muted">-</span>`}</td>
            <td class="muted">${emptyCell(key.updated_at)}</td>
            <td class="actions-cell">
              ${iconButton("key-menu", "Key actions", "more", "dots-button", menuStateAttrs(`key:${key.id}`))}
              <div class="action-menu" ${menuHiddenAttr(`key:${key.id}`)}>
                ${menuButton("edit-key", "Edit key", "Edit")}
                ${menuButton("toggle-key", toggleLabel, toggleLabel, "menu-item", `data-next-status="${nextStatus}"`)}
                ${menuButton("delete-key", confirming ? "Confirm delete key" : "Delete key", confirming ? "Confirm delete" : "Delete", `menu-item danger ${confirming ? "confirming" : ""}`)}
              </div>
            </td>
          </tr>
          <tr class="key-edit-row" data-key-edit-id="${escapedId}" hidden>
            <td><input data-field="label" value="${escapeAttr(key.label)}" aria-label="Key label" /></td>
            <td><input data-field="api_key" type="password" placeholder="Keep current key" aria-label="New API key" /></td>
            <td>
              <select data-field="status" aria-label="Key status">
                ${["active", "disabled", "exhausted", "error"].map((status) => `
                  <option value="${status}" ${status === key.status ? "selected" : ""}>${status}</option>
                `).join("")}
              </select>
            </td>
            <td><input data-field="priority" type="number" value="${Number(key.priority || 0)}" aria-label="Key priority" /></td>
            <td class="muted">-</td>
            <td class="muted">-</td>
            <td class="muted">-</td>
            <td class="actions-cell create-actions">
              ${iconButton("save-key", "Save key", "check")}
              ${iconButton("cancel-key", "Cancel", "x", "secondary")}
            </td>
          </tr>
        `
      }

      function closeActionMenus(exceptMenu = null) {
        if (!exceptMenu) activeMenuKey = ""
        document.querySelectorAll(".action-menu").forEach((menu) => {
          if (menu !== exceptMenu) {
            menu.hidden = true
            const button = menu.parentElement?.querySelector('[aria-expanded]')
            if (button) button.setAttribute("aria-expanded", "false")
          }
        })
      }

      function wireMenuButton(button) {
        const menu = button?.parentElement?.querySelector(".action-menu")
        if (!button || !menu) return
        button.addEventListener("click", (event) => {
          event.stopPropagation()
          const nextHidden = !menu.hidden
          closeActionMenus(menu)
          menu.hidden = nextHidden
          button.setAttribute("aria-expanded", String(!menu.hidden))
        })
      }

      function keyEditRow(id) {
        return Array.from(keys.querySelectorAll(".key-edit-row")).find((row) => row.dataset.keyEditId === id)
      }

      function handleKeyAction(event) {
        const button = event.target.closest("[data-action]")
        if (!button || !keys.contains(button)) return
        const action = button.dataset.action
        if (action === "key-menu") {
          event.stopPropagation()
          const menu = button.parentElement.querySelector(".action-menu")
          const nextHidden = !menu.hidden
          closeActionMenus(menu)
          menu.hidden = nextHidden
          button.setAttribute("aria-expanded", String(!menu.hidden))
          return
        }
        if (action === "cancel-create-key") {
          creatingKey = false
          renderKeys(keyItems)
          return
        }
        if (action === "save-create-key") {
          createKeyFromRow(button.closest(".key-create-row"))
          return
        }
        const row = button.closest("[data-key-id], .key-edit-row")
        const id = row?.dataset.keyId || row?.dataset.keyEditId
        if (!id) return
        const key = keyData.get(id)
        if (action === "edit-key") {
          closeActionMenus()
          const editRow = keyEditRow(id)
          if (editRow) editRow.hidden = false
          return
        }
        if (action === "cancel-key") {
          row.hidden = true
          return
        }
        if (action === "save-key") {
          updateKey(id, {
            label: row.querySelector('[data-field="label"]').value,
            api_key: row.querySelector('[data-field="api_key"]').value,
            status: row.querySelector('[data-field="status"]').value,
            priority: Number(row.querySelector('[data-field="priority"]').value || "0"),
          })
          return
        }
        if (action === "toggle-key" && key) {
          closeActionMenus()
          updateKey(id, {
            label: key.label,
            api_key: "",
            status: button.dataset.nextStatus,
            priority: key.priority,
          })
          return
        }
        if (action === "delete-key" && key) {
          if (confirmingKeyDeleteId === id) {
            deleteKey(id)
          } else {
            confirmingKeyDeleteId = id
            activeMenuKey = `key:${id}`
            renderKeys(keyItems)
          }
        }
      }

      function handleModelAction(event) {
        const button = event.target.closest("[data-action]")
        if (!button || !models.contains(button)) return
        const action = button.dataset.action
        if (action === "model-menu") {
          event.stopPropagation()
          const menu = button.parentElement.querySelector(".action-menu")
          const nextHidden = !menu.hidden
          closeActionMenus(menu)
          menu.hidden = nextHidden
          button.setAttribute("aria-expanded", String(!menu.hidden))
          return
        }
        if (action === "cancel-create-model") {
          creatingModel = false
          renderModels()
          return
        }
        if (action === "save-create-model") {
          const id = button.closest("tr")?.querySelector("[data-create-model]")?.value || ""
          if (id) saveModelConfig(aiConfig.default_model || id, aiConfig.allowed_models.concat([id]))
          return
        }
        const id = button.closest("[data-model-id]")?.dataset.modelId
        if (!id) return
        if (action === "set-default-model") {
          closeActionMenus()
          saveModelConfig(id, aiConfig.allowed_models)
          return
        }
        if (action === "remove-model") {
          if (confirmingModelRemoveId === id) {
            const nextAllowed = aiConfig.allowed_models.filter((model) => model !== id)
            const nextDefault = aiConfig.default_model === id ? (nextAllowed[0] || "") : aiConfig.default_model
            saveModelConfig(nextDefault, nextAllowed)
          } else {
            confirmingModelRemoveId = id
            activeMenuKey = `model:${id}`
            renderModels()
          }
        }
      }

      function emptyCell(value) {
        return value ? escapeHtml(value) : "-"
      }

      async function createKeyFromRow(row) {
        try {
          await api("/api/admin/ai/keys", {
            method: "POST",
            body: JSON.stringify({
              label: row.querySelector('[data-create-field="label"]').value,
              api_key: row.querySelector('[data-create-field="api_key"]').value,
              priority: Number(row.querySelector('[data-create-field="priority"]').value || "0"),
            }),
          })
          creatingKey = false
          showNotice("Key added.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      async function updateKey(id, payload) {
        try {
          await api(`/api/admin/ai/keys/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: JSON.stringify(payload),
          })
          showNotice("Key updated.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      async function deleteKey(id) {
        try {
          await api(`/api/admin/ai/keys/${encodeURIComponent(id)}`, { method: "DELETE" })
          confirmingKeyDeleteId = ""
          activeMenuKey = ""
          showNotice("Key deleted.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      async function saveModelConfig(defaultModel, allowedModels) {
        try {
          await api("/api/admin/ai/config", {
            method: "PUT",
            body: JSON.stringify({
              default_model: defaultModel,
              allowed_models: allowedModels,
            }),
          })
          creatingModel = false
          confirmingModelRemoveId = ""
          activeMenuKey = ""
          showNotice("Models updated.")
          await refresh()
        } catch (error) {
          showNotice(error.message, true)
        }
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]))
      }

      function escapeAttr(value) {
        return escapeHtml(value)
      }

      document.querySelector("#refresh").addEventListener("click", refresh)
      document.querySelector("#logout").addEventListener("click", async () => {
        await fetch("/api/admin/logout", { method: "POST" })
        window.location.assign("/admin/login")
      })
      document.querySelector("#add-key-row").addEventListener("click", () => {
        creatingKey = true
        setActiveView("keys")
        renderKeys(keyItems)
        keys.querySelector('[data-create-field="label"]')?.focus()
      })
      document.querySelector("#add-model-row").addEventListener("click", () => {
        creatingModel = true
        setActiveView("models")
        renderModels()
        models.querySelector("[data-create-model]")?.focus()
      })
      navButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setActiveView(button.dataset.viewTarget)
        })
      })
      window.addEventListener("hashchange", () => {
        setActiveView(window.location.hash.replace("#", ""), false)
      })
      keys.addEventListener("click", handleKeyAction)
      models.addEventListener("click", handleModelAction)
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".actions-cell")) closeActionMenus()
      })
      setActiveView(window.location.hash.replace("#", ""), false)
      refresh()
    </script>
  </body>
</html>
