name: mooncraft-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOONCRAFT_POSTGRES_DB:-mooncraft}
      POSTGRES_USER: ${MOONCRAFT_POSTGRES_USER:-mooncraft}
      POSTGRES_PASSWORD: ${MOONCRAFT_POSTGRES_PASSWORD:-mooncraft}
    volumes:
      - mooncraft-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mooncraft:
    image: ${MOONCRAFT_IMAGE:-mooncraft:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOONCRAFT_PORT: 8080
      MOONCRAFT_APP_MODE: production
      MOONCRAFT_PUBLIC_BASE_URL: ${MOONCRAFT_PUBLIC_BASE_URL:-http://localhost:8080}
      MOONCRAFT_BUILD_PROFILE: ${MOONCRAFT_BUILD_PROFILE:-release}
      MOONCRAFT_DATABASE_URL: ${MOONCRAFT_DATABASE_URL:-postgres://mooncraft:${MOONCRAFT_POSTGRES_PASSWORD:-mooncraft}@postgres:5432/mooncraft}
      MOONCRAFT_HOST_DATA_DIR: ${MOONCRAFT_HOST_DATA_DIR:?Set MOONCRAFT_HOST_DATA_DIR to the host path mounted as /app/data}
      MOONCRAFT_AGENT_RUNTIME_IMAGE: ${MOONCRAFT_AGENT_RUNTIME_IMAGE:-docker.io/moonbitcloud/mooncraft-agent-runtime:0.1.0}
      MOONCRAFT_GITHUB_CLIENT_ID: ${MOONCRAFT_GITHUB_CLIENT_ID:-}
      MOONCRAFT_GITHUB_CLIENT_SECRET: ${MOONCRAFT_GITHUB_CLIENT_SECRET:-}
      MOONCRAFT_ADMIN_TOKEN: ${MOONCRAFT_ADMIN_TOKEN:-}
    ports:
      - "${MOONCRAFT_PROD_HTTP_PORT:-8080}:8080"
    volumes:
      - ${MOONCRAFT_HOST_DATA_DIR:?Set MOONCRAFT_HOST_DATA_DIR to the host path mounted as /app/data}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/api/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mooncraft-postgres:
