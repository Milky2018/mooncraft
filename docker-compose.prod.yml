name: mooncraft-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOONCRAFT_POSTGRES_DB:-mooncraft}
      POSTGRES_USER: ${MOONCRAFT_POSTGRES_USER:-mooncraft}
      POSTGRES_PASSWORD: ${MOONCRAFT_POSTGRES_PASSWORD:-mooncraft}
    volumes:
      - mooncraft-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mooncraft:
    image: ${MOONCRAFT_IMAGE:-mooncraft:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOONCRAFT_PORT: 8080
      MOONCRAFT_APP_MODE: production
      MOONCRAFT_PUBLIC_BASE_URL: ${MOONCRAFT_PUBLIC_BASE_URL:-http://localhost:8080}
      MOONCRAFT_BUILD_PROFILE: ${MOONCRAFT_BUILD_PROFILE:-release}
      MOONCRAFT_DATABASE_URL: ${MOONCRAFT_DATABASE_URL:-postgres://mooncraft:mooncraft@postgres:5432/mooncraft}
      MOONCRAFT_CODEX_DOCKER_IMAGE: ${MOONCRAFT_CODEX_DOCKER_IMAGE:-docker.io/moonbitcloud/codex:codex-0.125.0-node24}
      MOONCRAFT_GITHUB_CLIENT_ID: ${MOONCRAFT_GITHUB_CLIENT_ID:-}
      MOONCRAFT_GITHUB_CLIENT_SECRET: ${MOONCRAFT_GITHUB_CLIENT_SECRET:-}
    ports:
      - "${MOONCRAFT_PROD_HTTP_PORT:-8080}:8080"
    volumes:
      - mooncraft-runtime:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mooncraft-postgres:
  mooncraft-runtime:
